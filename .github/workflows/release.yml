name: Release

# Cuts a release from a tag: `git tag v1.2.3 && git push origin v1.2.3`.
#
# Everything that can be checked cheaply is checked before the upload, because a version
# released to Maven Central can never be replaced or withdrawn. See RELEASING.md for the
# secrets this needs and for the steps to take before pushing the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Check the tag, the build and the README agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(./gradlew -q printVersion)"

          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::Refusing to release a snapshot version ($version)."
              exit 1
              ;;
          esac
          if ! grep -qF "com.galitianu:jev4j:$version" README.md; then
            echo "::error::The Gradle install snippet in README.md does not name $version."
            exit 1
          fi
          if ! grep -qF "<version>$version</version>" README.md; then
            echo "::error::The Maven install snippet in README.md does not name $version."
            exit 1
          fi
          if ! grep -qE "^## \[?$version\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      # Signing is skipped when no key is configured, so an unset secret would otherwise
      # surface as a confusing rejection from the Portal after the upload.
      - name: Check the publishing credentials are present
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set; see RELEASING.md."
              exit 1
            fi
          done

      - name: Build and test
        run: ./gradlew build javadoc --stacktrace

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Extract the changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            build/libs/*.jar
